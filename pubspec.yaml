name: rj_safe_parser
description: >-
  RJ Safe Parser — one annotation on the class, zero per-field boilerplate.
  build_runner reads your Dart field types and generates fromMap(), toMap(),
  and a full validation schema automatically. Inspired by Spring Boot's @Entity.
version: 0.1.0
homepage: https://github.com/rj/rj_safe_parser
repository: https://github.com/rj/rj_safe_parser
issue_tracker: https://github.com/rj/rj_safe_parser/issues

topics:
  - codegen
  - json
  - serialization
  - build_runner
  - annotation

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  meta: ^1.9.0
  # Required in dependencies (not dev_dependencies) because the generator
  # lives in lib/ and imports these packages directly.
  analyzer: ">=6.0.0 <13.0.0"
  build: ^2.4.0
  source_gen: ^1.4.0

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.24.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
