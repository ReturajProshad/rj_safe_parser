name: rj_safe_parser
description: >-
  RJ Safe Parser: Annotation-based Dart generator for JSON parsing, mapping, and validation with zero boilerplate.
version: 0.4.0
homepage: https://github.com/ReturajProshad/rj_safe_parser
repository: https://github.com/ReturajProshad/rj_safe_parser
issue_tracker: https://github.com/ReturajProshad/rj_safe_parser/issues

topics:
  - codegen
  - json
  - serialization
  - build-runner
  - annotation

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  meta: ^1.9.0
  # Required in dependencies (not dev_dependencies) because the generator
  # lives in lib/ and imports these packages directly.
  analyzer: ">=6.0.0 <13.0.0"
  build: ^3.0.0
  source_gen: ^4.2.3

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.24.0
  lints: ^3.0.0
